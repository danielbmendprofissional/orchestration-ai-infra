global:
  scrape_interval: 15s

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  # cada API .NET nova entra aqui, uma linha por projeto:
  # - job_name: <projeto>
  #   static_configs:
  #     - targets: ["host.docker.internal:<porta>"]