# RabbitMQ compartilhado dos projetos (dev local). Vhosts, usuários e permissões vêm de
# configs/infra/infra-config.mjs (API de gerenciamento) a partir de projects.json — cada projeto
# tem vhost e usuário próprios, com permissão só no próprio vhost.

# guest só funciona de dentro do container (e nem é criado: o usuário admin vem do .env)
loopback_users.guest = true

# log em JSON no console: o Alloy manda pro Loki e o Grafana lê o nível sozinho
log.console = true
log.console.formatter = json

# métricas agregadas (o painel oficial "RabbitMQ-Overview" usa essas)
prometheus.return_per_object_metrics = false
