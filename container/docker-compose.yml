name: infra

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    shm_size: 128mb   # valor de dev local
    stop_grace_period: 1m
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - infra_pgdata:/var/lib/postgresql/data
    networks:
      - infra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "15432:80"
    volumes:
      - infra_pgadmin_data:/var/lib/pgadmin
    networks:
      - infra-network
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - infra_redisdata:/data
    networks:
      - infra-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - infra-network

volumes:
  infra_pgdata:
  infra_pgadmin_data:
  infra_redisdata:

networks:
  infra-network:
    driver: bridge