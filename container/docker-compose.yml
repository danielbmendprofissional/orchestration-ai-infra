name: infra

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    shm_size: 128mb   # valor de dev local
    stop_grace_period: 1m
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - infra_pgdata:/var/lib/postgresql/data
      - ../banco/00-global-databases.sql:/docker-entrypoint-initdb.d/00-global-databases.sql:ro
      - ../banco/valuto/init-db.sql:/docker-entrypoint-initdb.d/01-init-valuto-db.sql:ro
    networks:
      - infra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "15432:80"
    volumes:
      - infra_pgadmin_data:/var/lib/pgadmin
    networks:
      - infra-network
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - infra_redisdata:/data
    networks:
      - infra-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - infra-network

  defectdojo-nginx:
    image: defectdojo/defectdojo-nginx:latest
    container_name: defectdojo-nginx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8443:8443"
    depends_on:
      - defectdojo-uwsgi
    networks:
      - infra-network

  defectdojo-uwsgi:
    image: defectdojo/defectdojo-django:latest
    container_name: defectdojo-uwsgi
    restart: unless-stopped
    command: /entrypoint-uwsgi.sh
    env_file:
      - .env
    environment:
      DD_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra-network

  defectdojo-celerybeat:
    image: defectdojo/defectdojo-django:latest
    container_name: defectdojo-celerybeat
    restart: unless-stopped
    command: /entrypoint-celery-beat.sh
    env_file:
      - .env
    environment:
      DD_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - defectdojo-uwsgi
    networks:
      - infra-network

  defectdojo-celeryworker:
    image: defectdojo/defectdojo-django:latest
    container_name: defectdojo-celeryworker
    restart: unless-stopped
    command: /entrypoint-celery-worker.sh
    env_file:
      - .env
    environment:
      DD_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - defectdojo-uwsgi
    networks:
      - infra-network

  defectdojo-initializer:
    image: defectdojo/defectdojo-django:latest
    container_name: defectdojo-initializer
    command: /entrypoint-initializer.sh
    env_file:
      - .env
    environment:
      DD_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/defectdojo
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - infra_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - infra-network

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra-network

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis
    networks:
      - infra-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - infra_loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - infra-network

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - infra-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - infra_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - infra-network

volumes:
  infra_pgdata:
  infra_pgadmin_data:
  infra_redisdata:
  infra_prometheus_data:
  infra_loki_data:
  infra_grafana_data:  

networks:
  infra-network:
    driver: bridge