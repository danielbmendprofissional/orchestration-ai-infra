name: infra

services:
  postgres:
    build:
      context: ./files/postgres
    container_name: postgres
    restart: unless-stopped
    shm_size: 128mb   # valor de dev local
    stop_grace_period: 1m
    env_file:
      - .env
    command: postgres -c shared_preload_libraries=pgaudit -c pgaudit.log=ddl,write
    ports:
      - "5432:5432"
    volumes:
      - infra_pgdata:/var/lib/postgresql/data
      - ../banco/00-global-databases.sql:/docker-entrypoint-initdb.d/00-global-databases.sql:ro
      - ../banco/valuto/init-db.sql:/docker-entrypoint-initdb.d/01-init-valuto-db.sql:ro
      - ../banco/02-enable-pgaudit.sql:/docker-entrypoint-initdb.d/02-enable-pgaudit.sql:ro
    networks:
      - infra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "15432:80"
    volumes:
      - infra_pgadmin_data:/var/lib/pgadmin
    networks:
      - infra-network
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - infra_redisdata:/data
    networks:
      - infra-network

  # Gateway de LLM (OpenAI-compatible) na frente dos executores do pi.dev — combos e
  # decisões em ../configs/omniroute/combos.md. Guarda chave de provider: porta só em
  # 127.0.0.1 e REQUIRE_API_KEY=true, nunca expor na rede.
  omniroute:
    image: diegosouzapw/omniroute:3.8.51   # versão fixa: config/ é aplicada pela API de gerenciamento, upgrade = testar export/apply antes
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379/15   # db 15 reservado pro omniroute, projetos usam ACL por prefixo no db 0
      REQUIRE_API_KEY: "true"
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD}
      OMNIROUTE_MEMORY_MB: "2048"        # recomendado pra 1 usuário rodando coding agents
    ports:
      - "127.0.0.1:20128:20128"   # dashboard + /v1
      - "127.0.0.1:20129:20129"   # API
    volumes:
      - infra_omniroute_data:/app/data
    depends_on:
      - redis
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - infra-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - infra_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - infra-network

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra-network

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis
    networks:
      - infra-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - infra_loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - infra-network

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - infra-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - infra_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - infra-network

  falco:
    image: falcosecurity/falco-no-driver:latest
    container_name: falco
    restart: unless-stopped
    privileged: true
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - /sys/kernel/debug:/sys/kernel/debug
    environment:
      FALCO_BPF_PROBE: ""
    networks:
      - infra-network

volumes:
  infra_pgdata:
  infra_pgadmin_data:
  infra_redisdata:
  infra_prometheus_data:
  infra_loki_data:
  infra_grafana_data:
  infra_omniroute_data:

networks:
  infra-network:
    driver: bridge