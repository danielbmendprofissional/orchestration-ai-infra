# Redis compartilhado dos projetos (dev local). Usuários e muros: generated/redis/users.acl,
# gerado por configs/infra/infra-config.mjs a partir de projects.json — nunca editar o .acl à mão.
# Cada projeto só enxerga as chaves e canais "<projeto>:*" (ver configs/infra/README.md).

aclfile /usr/local/etc/redis/acl/users.acl

# Persistência: sessões BFF (cookie → tokens) moram aqui; perder o volume desloga todo mundo.
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000

# Sessão não pode ser despejada pra liberar memória: cheio = erro explícito, não logout silencioso.
maxmemory 512mb
maxmemory-policy noeviction

protected-mode yes
