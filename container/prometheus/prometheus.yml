# Métricas da infra compartilhada + das APIs dos projetos.
# Projetos NÃO entram aqui à mão: vêm de configs/infra/projects.json ("metrics"), que o
# infra-config.mjs grava em generated/prometheus/projects.json (file_sd, recarrega sozinho).

global:
  scrape_interval: 15s
  external_labels:
    env: dev-local

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { project: infra }
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]
        labels: { project: infra }
  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]
        labels: { project: infra }
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels: { project: infra }
  # filas por vhost (= por projeto): rabbitmq_detailed_queue_messages_ready{vhost="valuto",queue=...}
  - job_name: rabbitmq_queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels: { project: infra }
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
        labels: { project: infra }
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels: { project: infra }
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels: { project: infra }
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels: { project: infra }

  # APIs dos projetos (rodando no host: dotnet run → host.docker.internal:<porta>/metrics)
  - job_name: projects
    file_sd_configs:
      - files: ["/etc/prometheus/generated/projects.json"]
