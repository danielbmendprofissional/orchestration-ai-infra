name: Global Dev Stack
version: 1.0.0
schema: v1

# ── MODELOS ────────────────────────────────────────────────────
models:

  # Chat + Edit + Apply — qualidade para perguntas e edições
  - name: Qwen 7B — Chat
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.1        # baixo = mais preciso para código
      contextLength: 8192   # manter baixo na RTX 4060 8GB
      keepAlive: 1800        # mantém modelo carregado por 30min
    chatOptions:
      baseSystemMessage: "Você é um assistente de desenvolvimento. Responda de forma concisa e técnica. Prefira código a explicações longas. Se não souber algo com certeza, diga explicitamente."

  # Autocomplete — modelo especializado em FIM (fill-in-middle)
  # NUNCA use o 7B para autocomplete — será lento demais
  - name: Qwen 1.5B — Autocomplete
    provider: ollama
    model: qwen2.5-coder:1.5b
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    autocompleteOptions:
      disable: false
      debounceDelay: 250          # ms de espera antes de acionar
      maxPromptTokens: 1024      # contexto enviado ao modelo
      modelTimeout: 3000          # abandona se demorar mais que 3s
      maxSuffixPercentage: 0.2   # 20% do contexto para código após o cursor
      prefixPercentage: 0.3      # 30% para código antes do cursor
      onlyMyCode: true            # ignora node_modules, dist, etc
      useCache: true              # cacheia sugestões repetidas
      useImports: true            # inclui imports no contexto
      useRecentlyEdited: true    # prioriza arquivos editados recentemente

  # Embeddings — modelo específico para vetores semânticos
  # NÃO é um LLM — é um modelo de embedding para @codebase e @docs
  - name: Nomic — Embed
    provider: ollama
    model: nomic-embed-text
    apiBase: http://localhost:11434
    roles:
      - embed
    embedOptions:
      maxChunkSize: 512    # tokens por chunk de documento
      maxBatchSize: 25     # chunks por requisição ao Ollama

# ── CONTEXT PROVIDERS ──────────────────────────────────────────
# Habilita @ no chat: @file, @code, @diff, @terminal, @codebase
context:
  - provider: file          # @file: referenciar arquivos do projeto
  - provider: code          # @code: referenciar funções/classes específicas
  - provider: diff          # @diff: ver mudanças pendentes do Git
  - provider: terminal      # @terminal: incluir output do terminal
  - provider: codebase      # @codebase: busca semântica (usa nomic-embed-text)
  - provider: folder        # @folder: referenciar pasta inteira
  - provider: open          # @open: arquivos abertos no editor

# ── RULES GLOBAIS ──────────────────────────────────────────────
# Apenas regras que se aplicam a QUALQUER projeto
rules:
  - "Responda sempre em português brasileiro."
  - "Seja conciso: prefira código a explicações longas."
  - "Se não souber algo com certeza, diga explicitamente em vez de inventar."
  - "Nunca faça commit ou push — sempre pergunte antes de qualquer operação Git destrutiva."
  - "Ao gerar código, resolva erros e warnings antes de entregar."

# ── PROMPTS GENÉRICOS ──────────────────────────────────────────
# Slash commands que funcionam em qualquer projeto
prompts:
  - name: review
    description: Revisar código selecionado
    prompt: |
      Revise este código. IGNORE estilo, formatação e naming.
      FOQUE apenas em: bugs reais, falhas de design, segurança, performance.
      Para cada problema:
      SEVERIDADE: [CRÍTICO | ALTO | MÉDIO]
      PROBLEMA: [1 linha]
      IMPACTO: [o que quebra se não corrigir]
      CORREÇÃO: [código corrigido]
      Se não encontrar problemas reais, diga explicitamente.

  - name: doc
    description: Gerar documentação
    prompt: |
      Gere documentação completa para este código.
      Inclua: o que faz, parâmetros (tipo e descrição), retorno e um exemplo de uso real.

  - name: explain
    description: Explicar código selecionado
    prompt: |
      Explique este código em 3 partes:
      1. O que faz (1 parágrafo)
      2. Como funciona passo a passo
      3. O que quebraria se eu mudar X (identifique o ponto mais crítico)

  - name: refactor
    description: Refatorar mantendo comportamento
    prompt: |
      Refatore este código para melhorar legibilidade e manutenibilidade.
      RESTRIÇÕES obrigatórias:
      - Comportamento idêntico — zero mudança de lógica
      - Assinatura pública inalterada
      - NÃO adicione abstrações desnecessárias

# ── DOCS TÉCNICAS GLOBAIS ──────────────────────────────────────
# Documentações que são úteis em qualquer projeto
# Use @docs no chat para consultar
docs:
  - name: Continue Docs
    startUrl: https://docs.continue.dev/intro
  - name: TypeScript Handbook
    startUrl: https://www.typescriptlang.org/docs/handbook/intro.html
  - name: Git Documentation
    startUrl: https://git-scm.com/doc